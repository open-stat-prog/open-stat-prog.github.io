<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Descriptive statistics</title>
<desc>A bell-shaped histogram in navy, gold, and green with a red dashed mean line, and a small green boxplot beneath, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- baseline -->
<line x1="90" y1="300" x2="390" y2="300" stroke="#1D3557" stroke-width="4" stroke-linecap="round"/>

<!-- histogram bars forming a bell shape -->
<rect x="96"  y="272" width="32" height="28" rx="3" fill="#1D3557"/>
<rect x="134" y="248" width="32" height="52" rx="3" fill="#1D3557"/>
<rect x="172" y="206" width="32" height="94" rx="3" fill="#D4A017"/>
<rect x="210" y="150" width="32" height="150" rx="3" fill="#D4A017"/>
<rect x="248" y="182" width="32" height="118" rx="3" fill="#2A6041"/>
<rect x="286" y="228" width="32" height="72" rx="3" fill="#2A6041"/>
<rect x="324" y="264" width="32" height="36" rx="3" fill="#1D3557"/>

<!-- mean line -->
<line x1="226" y1="120" x2="226" y2="300" stroke="#9E2A2B" stroke-width="4" stroke-dasharray="8 7"/>
<circle cx="226" cy="112" r="9" fill="#9E2A2B"/>

<!-- small boxplot beneath -->
<line x1="150" y1="352" x2="302" y2="352" stroke="#2A6041" stroke-width="3"/>
<rect x="196" y="336" width="70" height="32" rx="4" fill="#2A6041" fill-opacity="0.25" stroke="#2A6041" stroke-width="3"/>
<line x1="226" y1="336" x2="226" y2="368" stroke="#2A6041" stroke-width="3"/>

</svg>
