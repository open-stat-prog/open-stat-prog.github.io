<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Packages and documentation</title>
<desc>A navy package box with a gold ribbon beside a green open book with white text lines, and a red question mark badge for documentation help, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- package box -->
<rect x="90" y="176" width="150" height="140" rx="10" fill="#1D3557"/>
<rect x="90" y="176" width="150" height="40" fill="#16293F"/>
<rect x="150" y="176" width="30" height="140" fill="#D4A017"/>
<rect x="90" y="196" width="150" height="16" fill="#D4A017"/>
<polygon points="150,150 168,176 195,176 172,152" fill="#D4A017"/>
<polygon points="180,150 162,176 135,176 158,152" fill="#D4A017"/>

<!-- open book -->
<path d="M 260 190 Q 300 174 340 190 L 340 320 Q 300 304 260 320 Z" fill="#2A6041"/>
<path d="M 340 190 Q 380 174 420 190 L 420 320 Q 380 304 340 320 Z" fill="#2A6041"/>
<line x1="340" y1="190" x2="340" y2="320" stroke="#16293F" stroke-width="4"/>

<line x1="272" y1="214" x2="326" y2="204" stroke="#FBF6E9" stroke-width="5"/>
<line x1="272" y1="240" x2="326" y2="230" stroke="#FBF6E9" stroke-width="5"/>
<line x1="272" y1="266" x2="316" y2="258" stroke="#FBF6E9" stroke-width="5"/>

<line x1="354" y1="204" x2="408" y2="214" stroke="#FBF6E9" stroke-width="5"/>
<line x1="354" y1="230" x2="408" y2="240" stroke="#FBF6E9" stroke-width="5"/>
<line x1="364" y1="258" x2="408" y2="266" stroke="#FBF6E9" stroke-width="5"/>

<!-- help badge -->
<g transform="translate(392,164)">
  <circle r="30" fill="#9E2A2B"/>
  <text x="0" y="11" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FBF6E9" text-anchor="middle">?</text>
</g>

</svg>
