<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Reproducible reporting</title>
<desc>A blue document with text lines and a red bookmark, wrapped by a green circular refresh loop, with a gold pencil and check accents, on a cream card with a gold border.</desc>

<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M1 1 L8 5 L1 9 Z" fill="#2A6041"/>
</marker>
</defs>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- refresh loop -->
<path d="M 140 240 A 100 100 0 1 1 158 300" fill="none" stroke="#2A6041" stroke-width="14" stroke-linecap="round" marker-end="url(#arrowhead)"/>

<!-- document -->
<path d="M 176 130 L 268 130 L 306 168 L 306 356 L 176 356 Z" fill="#1D3557"/>
<path d="M 268 130 L 268 168 L 306 168 Z" fill="#EAF1F8"/>
<rect x="192" y="196" width="98" height="10" rx="5" fill="#EAF1F8"/>
<rect x="192" y="222" width="98" height="10" rx="5" fill="#EAF1F8"/>
<rect x="192" y="248" width="70" height="10" rx="5" fill="#EAF1F8"/>
<rect x="192" y="288" width="98" height="10" rx="5" fill="#EAF1F8"/>
<rect x="192" y="314" width="60" height="10" rx="5" fill="#EAF1F8"/>

<!-- bookmark -->
<path d="M 224 130 L 254 130 L 254 176 L 239 164 L 224 176 Z" fill="#9E2A2B"/>

<!-- gold check badge -->
<g transform="translate(340,362)">
  <circle r="28" fill="#D4A017"/>
  <path d="M -12 0 L -3 10 L 15 -11" fill="none" stroke="#FBF6E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>
