<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lists and dataframes</title>
<desc>A table with a gold header row and navy body cells representing a dataframe, with a red curly brace and green list dots representing a nested list, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- dataframe table -->
<rect x="86" y="120" width="240" height="200" rx="10" fill="#1D3557"/>
<rect x="86" y="120" width="240" height="46" rx="10" fill="#D4A017"/>
<rect x="86" y="146" width="240" height="20" fill="#D4A017"/>

<line x1="166" y1="120" x2="166" y2="320" stroke="#FBF6E9" stroke-width="4"/>
<line x1="246" y1="120" x2="246" y2="320" stroke="#FBF6E9" stroke-width="4"/>

<line x1="86" y1="192" x2="326" y2="192" stroke="#FBF6E9" stroke-width="4"/>
<line x1="86" y1="244" x2="326" y2="244" stroke="#FBF6E9" stroke-width="4"/>
<line x1="86" y1="270" x2="326" y2="270" stroke="#FBF6E9" stroke-width="4" opacity="0.5"/>

<!-- list accent, right side -->
<path d="M 372 130 Q 352 130 352 150 L 352 200 Q 352 216 336 220 Q 352 224 352 240 L 352 290 Q 352 310 372 310"
      fill="none" stroke="#9E2A2B" stroke-width="7" stroke-linecap="round"/>

<circle cx="398" cy="160" r="9" fill="#2A6041"/>
<circle cx="398" cy="220" r="9" fill="#2A6041"/>
<circle cx="398" cy="280" r="9" fill="#2A6041"/>

</svg>
