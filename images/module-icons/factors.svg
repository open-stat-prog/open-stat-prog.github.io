<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Factors</title>
<desc>Three colored category chips labelled low, medium, and high, each connected by an arrow to a numbered navy circle below representing the underlying factor levels, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- category chips -->
<rect x="84"  y="120" width="92" height="60" rx="18" fill="#2A6041"/>
<text x="130" y="157" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FBF6E9" text-anchor="middle">low</text>

<rect x="184" y="120" width="112" height="60" rx="18" fill="#D4A017"/>
<text x="240" y="157" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FBF6E9" text-anchor="middle">medium</text>

<rect x="304" y="120" width="92" height="60" rx="18" fill="#9E2A2B"/>
<text x="350" y="157" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FBF6E9" text-anchor="middle">high</text>

<!-- arrows -->
<line x1="130" y1="184" x2="130" y2="268" stroke="#2A6041" stroke-width="5" stroke-linecap="round"/>
<polygon points="130,286 120,266 140,266" fill="#2A6041"/>

<line x1="240" y1="184" x2="240" y2="268" stroke="#D4A017" stroke-width="5" stroke-linecap="round"/>
<polygon points="240,286 230,266 250,266" fill="#D4A017"/>

<line x1="350" y1="184" x2="350" y2="268" stroke="#9E2A2B" stroke-width="5" stroke-linecap="round"/>
<polygon points="350,286 340,266 360,266" fill="#9E2A2B"/>

<!-- level circles -->
<circle cx="130" cy="326" r="34" fill="#1D3557"/>
<text x="130" y="336" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FBF6E9" text-anchor="middle">1</text>

<circle cx="240" cy="326" r="34" fill="#1D3557"/>
<text x="240" y="336" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FBF6E9" text-anchor="middle">2</text>

<circle cx="350" cy="326" r="34" fill="#1D3557"/>
<text x="350" y="336" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FBF6E9" text-anchor="middle">3</text>

</svg>
