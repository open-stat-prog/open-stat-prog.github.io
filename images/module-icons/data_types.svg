<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Data types</title>
<desc>Four rounded chips labelled 123, quoted text, a true/false toggle, and a bracketed list, in navy, gold, green, and red, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- numeric chip -->
<rect x="60" y="140" width="170" height="100" rx="16" fill="#1D3557"/>
<text x="145" y="200" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FBF6E9" text-anchor="middle">123</text>

<!-- character chip -->
<rect x="250" y="140" width="170" height="100" rx="16" fill="#D4A017"/>
<text x="335" y="200" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FBF6E9" text-anchor="middle">"abc"</text>

<!-- logical chip -->
<rect x="60" y="260" width="170" height="100" rx="16" fill="#2A6041"/>
<g transform="translate(145,310)">
  <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#FBF6E9" opacity="0.18"/>
  <circle cx="-22" cy="0" r="16" fill="#FBF6E9"/>
  <text x="14" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FBF6E9">TRUE</text>
</g>

<!-- list / vector chip -->
<rect x="250" y="260" width="170" height="100" rx="16" fill="#9E2A2B"/>
<text x="335" y="200" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FBF6E9" text-anchor="middle" transform="translate(0,110)">[ 1, 2 ]</text>

</svg>
