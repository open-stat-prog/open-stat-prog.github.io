<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Commands</title>
<desc>A terminal window with red, gold, and green title dots, a green prompt symbol, colored syntax tokens, and a blinking cursor, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- terminal frame -->
<rect x="80" y="140" width="320" height="200" rx="14" fill="#1D3557"/>

<!-- title dots -->
<circle cx="104" cy="164" r="7" fill="#9E2A2B"/>
<circle cx="126" cy="164" r="7" fill="#D4A017"/>
<circle cx="148" cy="164" r="7" fill="#2A6041"/>

<!-- console body -->
<rect x="96" y="188" width="288" height="132" rx="8" fill="#FBF6E9"/>

<!-- line 1: prompt + tokens -->
<text x="112" y="228" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2A6041">&gt;</text>
<rect x="136" y="213" width="66" height="16" rx="4" fill="#D4A017"/>
<rect x="208" y="213" width="42" height="16" rx="4" fill="#1D3557"/>
<rect x="256" y="213" width="86" height="16" rx="4" fill="#9E2A2B"/>

<!-- line 2: prompt + cursor -->
<text x="112" y="272" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2A6041">&gt;</text>
<rect x="136" y="256" width="18" height="24" fill="#D4A017"/>

</svg>
