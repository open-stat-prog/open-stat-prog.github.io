<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Data manipulation</title>
<desc>Scattered colored dots flowing into a gold funnel and coming out below as a neat row of sorted colored bars, on a cream card with a gold border.</desc>

<rect x="8" y="8" width="464" height="464" rx="40" fill="#FBF6E9" stroke="#D4A017" stroke-width="3"/>

<!-- scattered input dots -->
<circle cx="120" cy="110" r="11" fill="#1D3557"/>
<circle cx="168" cy="130" r="11" fill="#9E2A2B"/>
<circle cx="220" cy="104" r="11" fill="#2A6041"/>
<circle cx="270" cy="128" r="11" fill="#D4A017"/>
<circle cx="316" cy="106" r="11" fill="#9E2A2B"/>
<circle cx="360" cy="128" r="11" fill="#1D3557"/>
<circle cx="150" cy="158" r="9" fill="#2A6041"/>
<circle cx="290" cy="160" r="9" fill="#1D3557"/>

<!-- funnel -->
<path d="M 130 178 L 350 178 L 262 268 L 262 300 L 218 300 L 218 268 Z" fill="#D4A017"/>

<!-- sorted output bars -->
<rect x="140" y="356" width="42" height="56" rx="5" fill="#1D3557"/>
<rect x="192" y="336" width="42" height="76" rx="5" fill="#2A6041"/>
<rect x="244" y="316" width="42" height="96" rx="5" fill="#9E2A2B"/>
<rect x="296" y="352" width="42" height="60" rx="5" fill="#1D3557"/>

<line x1="130" y1="412" x2="350" y2="412" stroke="#1D3557" stroke-width="4" stroke-linecap="round"/>

</svg>
